- name: Install Docker, Deploy App, and Configure NGINX with stub_status
  hosts: servers
  become: yes

  tasks:

    - name: Install required system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present
        update_cache: yes

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker APT repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu focal stable
        state: present

    - name: Install Docker
      apt:
        name: docker-ce
        state: present
        update_cache: yes

    - name: Ensure Docker service is started and enabled
      service:
        name: docker
        state: started
        enabled: yes

    - name: Pull Docker image
      docker_image:
        name: pratiklanjewar/mydemoapp
        tag: latest
        source: pull

    - name: Run Docker container
      docker_container:
        name: main_app_container
        image: pratiklanjewar/mydemoapp:latest
        state: started
        restart_policy: always
        ports:
          - "5000:5000"

    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes
